root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/simple-torrent.exe ."
  bin = "tmp/simple-torrent.exe"
  include_ext = ["go", "html", "css", "js"]
  exclude_dir = ["tmp", "vendor", "downloads"]
  include_dir = []
  exclude_file = []
  delay = 1000
  stop_on_error = true
  send_interrupt = false
  kill_delay = "0s"

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = false
